<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Analysis - Trend Comparison</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/stock-core.js"></script>
<script src="js/store.js"></script>
<style>
.chart-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin-bottom:20px; }
.chart-title { font-size:0.88rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; }
.chart-wrap { position:relative; height:360px; }
.chart-loading { text-align:center; padding:44px; color:var(--text-muted); font-size:0.88rem; }
.movement-up { color:var(--green); font-weight:700; }
.movement-down { color:var(--red); font-weight:700; }
.movement-flat { color:var(--text-muted); }
</style>
</head>
<body>
<div id="loadingOverlay"><div class="loader-spinner"></div><div class="loader-text" id="loadingMsg">Loading local stock data...</div></div>

<nav class="nav">
  <a class="nav-brand" href="stocks.html">Stock Analysis</a>
  <div class="nav-links">
    <a href="stocks.html">My Portfolios</a>
    <a href="stock_compare.html" class="active">Trend Comparison</a>
    <a href="stock_tracker.html">Watch Lists</a>
  </div>
  <div class="nav-right">
    <span id="storageStatus" class="drive-status-text"></span>
    <div class="nav-btn-row">
      <select class="global-profile-sel profile-sel-nav"></select>
      <button class="btn btn-sm btn-ghost" onclick="reloadLocalDataSafely()" title="Reload local JSON">↻</button>
      <button class="btn btn-sm btn-teal" onclick="localSave()" title="Save local JSON">Save</button>
      <button class="btn btn-sm btn-ghost" onclick="localBackup()" title="Create local backup">Backup</button>
      <button class="btn btn-sm btn-ghost" onclick="exportTrendExcel()" title="Export analysis">Export</button>
    </div>
  </div>
</nav>

<main class="page">
  <div class="page-title">Trend Comparison</div>

  <div class="form-row mb-16">
    <div class="form-group">
      <label>Period</label>
      <select id="periodSelect" class="input-md" onchange="render()">
        <option value="YTD">Year to Date</option>
        <option value="1M">1 Month</option>
        <option value="3M">3 Months</option>
        <option value="6M">6 Months</option>
        <option value="1Y">1 Year</option>
        <option value="ALL">All Available</option>
      </select>
    </div>
    <div class="form-group">
      <label>Benchmark</label>
      <select id="benchmarkSelect" class="input-md" onchange="render()">
        <option value="SPY">S&amp;P 500 (SPY)</option>
        <option value="GLD">Gold (GLD)</option>
        <option value="QQQ">Nasdaq 100 (QQQ)</option>
        <option value="DIA">Dow Jones (DIA)</option>
        <option value="IWM">Russell 2000 (IWM)</option>
        <option value="VTI">US Total Market (VTI)</option>
      </select>
    </div>
    <div class="form-group" style="justify-content:flex-end">
      <button class="btn btn-primary" id="trendFetchBtn" onclick="fetchComparisonPrices()">Fetch Current Prices</button>
    </div>
  </div>

  <div class="kpi-grid" id="trendKpis"></div>

  <section class="chart-card">
    <div class="chart-title"><span>Overall Portfolio Performance</span><span id="chartPeriod"></span></div>
    <div id="trendEmpty" class="chart-loading"></div>
    <div id="trendChartWrap" class="chart-wrap" style="display:none"><canvas id="trendChart"></canvas></div>
  </section>

  <section class="mb-16">
    <div class="section-header"><div class="section-title">Portfolio Accounts</div></div>
    <div class="tbl-wrap"><table id="accountComparisonTable"></table></div>
  </section>

  <section class="mb-16">
    <div class="section-header"><div class="section-title">Holdings Movement</div></div>
    <div class="tbl-wrap"><table id="holdingComparisonTable"></table></div>
  </section>

  <details>
    <summary>Portfolio Reference Prices</summary>
    <div class="details-content">
      <div class="tbl-wrap"><table id="holdingReferenceTable"></table></div>
    </div>
  </details>

  <details>
    <summary>Benchmark Price Entry</summary>
    <div class="details-content">
      <div class="form-row">
        <div class="form-group"><label>Symbol</label><input id="benchmarkSymbol" class="input-sm" readonly></div>
        <div class="form-group"><label>Date</label><input id="benchmarkDate" type="date" class="input-md"></div>
        <div class="form-group"><label>Close</label><input id="benchmarkClose" type="number" min="0" step="0.01" class="input-md"></div>
        <div class="form-group" style="justify-content:flex-end"><button class="btn btn-secondary" onclick="saveBenchmarkPrice()">Save Price</button></div>
      </div>
      <div class="tbl-wrap"><table id="benchmarkHistoryTable"></table></div>
    </div>
  </details>
</main>

<div class="toast-container" id="toastContainer"></div>

<script>
const CHART_COLORS=['#068a91','#d29922','#58a6ff','#3fb950','#f85149','#a371f7'];
const BENCHMARK_PROFILE='__BENCHMARKS__';
window.trendChart=null;

function toast(message,type='success'){const container=document.getElementById('toastContainer');const item=document.createElement('div');item.className=`toast ${type}`;item.textContent=message;container.appendChild(item);setTimeout(()=>item.remove(),3500);}
function profile(){return getActiveProfile();}
function fmt(value,decimals=2){return Number(value||0).toLocaleString('en-SG',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});}
function fmtPct(value){return Number.isFinite(value)?`${value>=0?'+':''}${fmt(value,1)}%`:'—';}
function pct(current,base){return base>0?(current-base)/base*100:NaN;}

function startDate(){
  const period=document.getElementById('periodSelect').value;
  const now=new Date();
  if(period==='YTD') return `${now.getFullYear()}-01-01`;
  if(period==='ALL') return '1900-01-01';
  const months={ '1M':1,'3M':3,'6M':6,'1Y':12 }[period]||0;
  now.setMonth(now.getMonth()-months);
  return now.toISOString().slice(0,10);
}

function benchmarkSymbol(){return document.getElementById('benchmarkSelect').value;}
function stockSnapshots(account,ticker){return loadStockPrices().filter(row=>row.profile===account&&row.ticker===ticker&&Number(row.close)>0).sort((a,b)=>String(a.asof_date).localeCompare(String(b.asof_date)));}
function benchmarkSnapshots(symbol=benchmarkSymbol()){
  const legacy=loadStockTrackerPrices().filter(row=>row.profile===profile()&&row.symbol===symbol&&Number(row.close)>0);
  const shared=loadStockTrackerPrices().filter(row=>row.profile===BENCHMARK_PROFILE&&row.symbol===symbol&&Number(row.close)>0);
  const byDate=new Map(legacy.map(row=>[row.asof_date,row]));
  shared.forEach(row=>byDate.set(row.asof_date,row));
  return [...byDate.values()].sort((a,b)=>String(a.asof_date).localeCompare(String(b.asof_date)));
}
function latestRow(rows){return rows[rows.length-1]||null;}
function referenceRow(rows,date){
  if(!rows.length) return null;
  if(date==='1900-01-01') return rows[0];
  const target=new Date(`${date}T00:00:00Z`).getTime();
  const nearest=rows.reduce((best,row)=>{
    const distance=Math.abs(new Date(`${row.asof_date}T00:00:00Z`).getTime()-target);
    return !best||distance<best.distance?{row,distance}:best;
  },null);
  return nearest&&nearest.distance<=14*24*3600*1000?nearest.row:null;
}
function rowAt(rows,date){return [...rows].reverse().find(row=>String(row.asof_date)<=date)||null;}

function holdingsFor(account){
  return StockCore.computeHoldings(loadStockTransactions().filter(row=>row.profile===account),(currency,date)=>appFxToSgd(currency,date)).holdings;
}

function holdingPerformance(account){
  const since=startDate();
  return holdingsFor(account).map(holding=>{
    const snapshots=stockSnapshots(account,holding.ticker);
    const baseline=referenceRow(snapshots,since);
    const latest=latestRow(snapshots);
    const movement=baseline&&latest?p(Number(latest.close),Number(baseline.close)):NaN;
    const marketValue=(Number(latest?.close)||0)*holding.qty*appFxToSgd(holding.currency,latest?.asof_date);
    return {...holding,baseline,latest,movement,marketValue};
  });
}

function p(current,base){return base>0?(current-base)/base*100:NaN;}

function portfolioPerformance(account){
  const rows=holdingPerformance(account).filter(row=>Number.isFinite(row.movement));
  const totalWeight=rows.reduce((sum,row)=>sum+(row.marketValue||row.cost_basis||0),0);
  if(!rows.length||!totalWeight) return NaN;
  return rows.reduce((sum,row)=>sum+row.movement*(row.marketValue||row.cost_basis||0),0)/totalWeight;
}

function selectedBenchmarkPerformance(){
  const rows=benchmarkSnapshots();
  const baseline=referenceRow(rows,startDate());
  const latest=latestRow(rows);
  return baseline&&latest?p(Number(latest.close),Number(baseline.close)):NaN;
}

async function fetchComparisonPrices(){
  const button=document.getElementById('trendFetchBtn');
  button.disabled=true;button.textContent='Fetching...';
  const holdings=holdingsFor(profile());
  const symbols=[...new Set([...holdings.map(row=>row.ticker),benchmarkSymbol()])];
  let stockPrices=loadStockPrices();
  let trackerPrices=loadStockTrackerPrices();
  const today=new Date().toISOString().slice(0,10);
  let fetched=0;const failed=[];
  for(const symbol of symbols){
    try{
      const quote=await fetchLocalQuote(symbol);
      const close=Number(quote.c)||0;
      if(close<=0) throw new Error('No price');
      if(symbol===benchmarkSymbol()){
        trackerPrices=trackerPrices.filter(row=>!(row.profile===BENCHMARK_PROFILE&&row.symbol===symbol&&row.asof_date===today));
        trackerPrices.push({price_id:uuid(),profile:BENCHMARK_PROFILE,symbol,asof_date:today,close,source:'finnhub',fetched_at:new Date().toISOString()});
      }
      if(holdings.some(row=>row.ticker===symbol)){
        stockPrices=stockPrices.filter(row=>!(row.profile===profile()&&row.ticker===symbol&&row.asof_date===today));
        stockPrices.push({profile:profile(),ticker:symbol,asof_date:today,close,source:'finnhub',fetched_at:new Date().toISOString()});
      }
      fetched++;
    }catch(error){failed.push(symbol);}
  }
  saveStockPrices(stockPrices);saveStockTrackerPrices(trackerPrices);
  button.disabled=false;button.textContent='Fetch Current Prices';
  render();
  if(failed.length) toast(`Fetched ${fetched}. Failed: ${failed.join(', ')}`,'info'); else toast(`Updated ${fetched} symbols`);
}

function saveBenchmarkPrice(){
  const symbol=benchmarkSymbol();
  const date=document.getElementById('benchmarkDate').value;
  const close=Number(document.getElementById('benchmarkClose').value)||0;
  if(!date||close<=0){toast('Date and a valid close are required','error');return;}
  const rows=loadStockTrackerPrices().filter(row=>!(row.profile===BENCHMARK_PROFILE&&row.symbol===symbol&&row.asof_date===date));
  rows.push({price_id:uuid(),profile:BENCHMARK_PROFILE,symbol,asof_date:date,close,source:'manual',fetched_at:new Date().toISOString()});
  saveStockTrackerPrices(rows);
  document.getElementById('benchmarkClose').value='';
  render();toast(`${symbol} price saved`);
}

function renderKpis(){
  const portfolio=portfolioPerformance(profile());
  const benchmark=selectedBenchmarkPerformance();
  const relative=Number.isFinite(portfolio)&&Number.isFinite(benchmark)?portfolio-benchmark:NaN;
  const holdings=holdingPerformance(profile()).filter(row=>Number.isFinite(row.movement));
  const leaders=holdings.filter(row=>row.movement>0).length;
  const laggards=holdings.filter(row=>row.movement<0).length;
  const kpis=[
    ['Portfolio',fmtPct(portfolio),portfolio],
    [benchmarkSymbol(),fmtPct(benchmark),benchmark],
    ['Vs Benchmark',fmtPct(relative),relative],
    ['Moving Up',String(leaders),leaders?1:0],
    ['Moving Down',String(laggards),laggards?-1:0],
  ];
  document.getElementById('trendKpis').innerHTML=kpis.map(([label,value,direction])=>`<div class="kpi ${direction>0?'green':direction<0?'red':'teal'}"><div class="kpi-label">${escapeHtml(label)}</div><div class="kpi-value ${direction>0?'pos':direction<0?'neg':'neutral'}">${escapeHtml(value)}</div></div>`).join('');
}

function renderAccounts(){
  const benchmark=selectedBenchmarkPerformance();
  const accounts=loadPortfolioAccounts().filter(account=>account.active!==false);
  let html='<thead><tr><th>Portfolio Account</th><th>Holdings</th><th>Period Return</th><th>Benchmark</th><th>Relative</th></tr></thead><tbody>';
  accounts.forEach(account=>{
    const performance=portfolioPerformance(account.name);
    const relative=Number.isFinite(performance)&&Number.isFinite(benchmark)?performance-benchmark:NaN;
    html+=`<tr><td class="bold">${escapeHtml(account.name)}</td><td>${holdingsFor(account.name).length}</td><td class="${performance>0?'pos':performance<0?'neg':''}">${fmtPct(performance)}</td><td>${fmtPct(benchmark)}</td><td class="${relative>0?'pos':relative<0?'neg':''}">${fmtPct(relative)}</td></tr>`;
  });
  if(!accounts.length) html+='<tr><td colspan="5" class="text-muted" style="text-align:center;padding:16px">No portfolio accounts.</td></tr>';
  document.getElementById('accountComparisonTable').innerHTML=html+'</tbody>';
}

function renderHoldings(){
  const benchmark=selectedBenchmarkPerformance();
  const rows=holdingPerformance(profile()).sort((a,b)=>(Number.isFinite(b.movement)?b.movement:-Infinity)-(Number.isFinite(a.movement)?a.movement:-Infinity));
  let html='<thead><tr><th>Stock</th><th>Start Price</th><th>Latest Price</th><th>Movement</th><th>Benchmark</th><th>Vs Benchmark</th><th>Direction</th></tr></thead><tbody>';
  rows.forEach(row=>{
    const relative=Number.isFinite(row.movement)&&Number.isFinite(benchmark)?row.movement-benchmark:NaN;
    const direction=!Number.isFinite(row.movement)?'No baseline':row.movement>0?'Up':row.movement<0?'Down':'Flat';
    const directionClass=row.movement>0?'movement-up':row.movement<0?'movement-down':'movement-flat';
    html+=`<tr><td class="bold">${escapeHtml(row.ticker)}</td><td>${row.baseline?fmt(row.baseline.close):'—'}</td><td>${row.latest?fmt(row.latest.close):'—'}</td><td class="${row.movement>0?'pos':row.movement<0?'neg':''}">${fmtPct(row.movement)}</td><td>${fmtPct(benchmark)}</td><td class="${relative>0?'pos':relative<0?'neg':''}">${fmtPct(relative)}</td><td class="${directionClass}">${direction}</td></tr>`;
  });
  if(!rows.length) html+='<tr><td colspan="7" class="text-muted" style="text-align:center;padding:16px">No open holdings in this portfolio.</td></tr>';
  document.getElementById('holdingComparisonTable').innerHTML=html+'</tbody>';
}

function saveHoldingReference(ticker){
  const date=document.getElementById(`reference_date_${ticker}`).value;
  const close=Number(document.getElementById(`reference_close_${ticker}`).value)||0;
  if(!date||close<=0){toast('Date and a valid close are required','error');return;}
  const rows=loadStockPrices().filter(row=>!(row.profile===profile()&&row.ticker===ticker&&row.asof_date===date));
  rows.push({profile:profile(),ticker,asof_date:date,close,source:'manual-reference',fetched_at:new Date().toISOString()});
  saveStockPrices(rows);render();toast(`${ticker} reference price saved`);
}

function renderHoldingReferences(){
  const date=startDate()==='1900-01-01'?new Date().toISOString().slice(0,10):startDate();
  const holdings=holdingsFor(profile());
  let html='<thead><tr><th>Stock</th><th>Reference Date</th><th>Close</th><th></th></tr></thead><tbody>';
  holdings.forEach(holding=>{
    const existing=referenceRow(stockSnapshots(profile(),holding.ticker),date);
    html+=`<tr><td class="bold">${escapeHtml(holding.ticker)}</td><td><input type="date" id="reference_date_${escapeAttr(holding.ticker)}" class="input-md" value="${escapeAttr(date)}"></td><td><input type="number" id="reference_close_${escapeAttr(holding.ticker)}" class="input-md" min="0" step="0.01" value="${existing?escapeAttr(existing.close):''}"></td><td><button class="btn btn-sm btn-secondary" onclick="saveHoldingReference(${jsArg(holding.ticker)})">Save</button></td></tr>`;
  });
  if(!holdings.length) html+='<tr><td colspan="4" class="text-muted" style="text-align:center;padding:12px">No open holdings.</td></tr>';
  document.getElementById('holdingReferenceTable').innerHTML=html+'</tbody>';
}

function portfolioSeries(){
  const holdings=holdingPerformance(profile()).filter(row=>row.baseline&&row.latest);
  const benchmarkRows=benchmarkSnapshots();
  const dates=[...new Set([...holdings.flatMap(row=>stockSnapshots(profile(),row.ticker).map(price=>price.asof_date)),...benchmarkRows.map(row=>row.asof_date)])].filter(date=>date>=startDate()).sort();
  const totalWeight=holdings.reduce((sum,row)=>sum+(row.marketValue||row.cost_basis||0),0);
  const portfolioData=dates.map(date=>{
    if(!totalWeight) return null;
    let coveredWeight=0,total=0;
    holdings.forEach(row=>{
      const current=rowAt(stockSnapshots(profile(),row.ticker),date);
      const weight=row.marketValue||row.cost_basis||0;
      if(!current||!row.baseline||weight<=0) return;
      total+=p(Number(current.close),Number(row.baseline.close))*weight;
      coveredWeight+=weight;
    });
    return coveredWeight?total/coveredWeight:null;
  });
  const benchmarkBase=referenceRow(benchmarkRows,startDate());
  const benchmarkData=dates.map(date=>{
    const row=rowAt(benchmarkRows,date);
    return row&&benchmarkBase?p(Number(row.close),Number(benchmarkBase.close)):null;
  });
  return {dates,portfolioData,benchmarkData};
}

function renderChart(){
  if(window.trendChart){window.trendChart.destroy();window.trendChart=null;}
  const empty=document.getElementById('trendEmpty');
  const wrap=document.getElementById('trendChartWrap');
  const series=portfolioSeries();
  const hasPortfolio=series.portfolioData.some(Number.isFinite);
  if(!series.dates.length||!hasPortfolio){empty.style.display='block';empty.textContent='Add portfolio price snapshots for the selected period to draw the comparison.';wrap.style.display='none';return;}
  empty.style.display='none';wrap.style.display='block';
  window.trendChart=new Chart(document.getElementById('trendChart'),{
    type:'line',
    data:{labels:series.dates.map(date=>new Date(date).toLocaleDateString('en-SG',{month:'short',day:'numeric',year:'2-digit'})),datasets:[
      {label:profile(),data:series.portfolioData,borderColor:CHART_COLORS[0],backgroundColor:'transparent',borderWidth:3,tension:0.25,spanGaps:true,pointRadius:2},
      {label:benchmarkSymbol(),data:series.benchmarkData,borderColor:CHART_COLORS[1],backgroundColor:'transparent',borderWidth:2,tension:0.25,spanGaps:true,pointRadius:2},
    ]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#8b949e'}},tooltip:{callbacks:{label:context=>` ${context.dataset.label}: ${fmtPct(context.raw)}`}}},scales:{x:{ticks:{color:'#8b949e',maxTicksLimit:12},grid:{color:'rgba(255,255,255,0.05)'}},y:{ticks:{color:'#8b949e',callback:value=>`${value}%`},grid:{color:'rgba(255,255,255,0.05)'}}}}
  });
}

function renderBenchmarkHistory(){
  const rows=benchmarkSnapshots().slice(-10).reverse();
  let html='<thead><tr><th>Date</th><th>Symbol</th><th>Close</th><th>Source</th></tr></thead><tbody>';
  rows.forEach(row=>{html+=`<tr><td>${escapeHtml(row.asof_date)}</td><td class="bold">${escapeHtml(row.symbol)}</td><td>${fmt(row.close)}</td><td>${escapeHtml(row.source||'')}</td></tr>`;});
  if(!rows.length) html+='<tr><td colspan="4" class="text-muted" style="text-align:center;padding:12px">No benchmark prices saved.</td></tr>';
  document.getElementById('benchmarkHistoryTable').innerHTML=html+'</tbody>';
}

function render(){
  document.getElementById('benchmarkSymbol').value=benchmarkSymbol();
  document.getElementById('benchmarkDate').value=startDate()==='1900-01-01'?new Date().toISOString().slice(0,10):startDate();
  document.getElementById('chartPeriod').textContent=document.getElementById('periodSelect').selectedOptions[0].text;
  renderKpis();renderAccounts();renderHoldings();renderHoldingReferences();renderChart();renderBenchmarkHistory();
}

function exportTrendExcel(){
  const benchmark=selectedBenchmarkPerformance();
  exportToExcel([
    {name:'Portfolio Accounts',data:loadPortfolioAccounts().filter(account=>account.active!==false).map(account=>({portfolio:account.name,holdings:holdingsFor(account.name).length,period_return_pct:portfolioPerformance(account.name),benchmark:benchmarkSymbol(),benchmark_return_pct:benchmark}))},
    {name:'Holding Comparison',data:holdingPerformance(profile()).map(row=>({ticker:row.ticker,start_date:row.baseline?.asof_date||'',start_price:row.baseline?.close||'',latest_date:row.latest?.asof_date||'',latest_price:row.latest?.close||'',movement_pct:row.movement,benchmark_return_pct:benchmark,relative_pct:Number.isFinite(row.movement)&&Number.isFinite(benchmark)?row.movement-benchmark:''}))},
  ]);
}

window.onProfileChange=function(){render();};
window.onDataLoaded=render;
</script>
</body>
</html>
